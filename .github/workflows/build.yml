name: Build 7Hills Link

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install grpcio protobuf pytest
      - run: python -m pytest -q tests
        env:
          PYTHONPATH: src

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name 7HillsLink
          --paths src
          --add-data "src/sevenhills_link/ui;sevenhills_link/ui"
          --add-data "src/sevenhills_link/data;sevenhills_link/data"
          --collect-submodules sevenhills_link
          --hidden-import keyring.backends.Windows
          --hidden-import pystray._win32
          --hidden-import win32com.client
          run_client.py
      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\dist\7HillsLink.exe --version | Out-String
          Write-Host "version: $v"
      - name: Single instance test
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'sitest'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $first = Start-Process dist/7HillsLink.exe -ArgumentList '--autostart' -PassThru
          Start-Sleep 12
          $second = Start-Process dist/7HillsLink.exe -ArgumentList '--autostart' -PassThru
          $second | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
          $log = Get-Content "$env:LOCALAPPDATA\7HillsLink\link.log" -ErrorAction SilentlyContinue
          $log
          $ok = $second.HasExited -and -not $first.HasExited
          Get-Process 7HillsLink -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) { Write-Error 'second start did not exit while the first kept running'; exit 1 }
          if (-not ($log -match 'already running')) { Write-Error 'no already-running line in link.log'; exit 1 }
      - name: Update install test
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'swaptest'
          New-Item -ItemType Directory -Force $d, "$d\lad\7HillsLink\update" | Out-Null
          Copy-Item dist/7HillsLink.exe "$d\7HillsLink.exe"
          Copy-Item dist/7HillsLink.exe "$d\lad\7HillsLink\update\7HillsLink-9.9.9.exe"
          $dummy = Start-Process ping -ArgumentList '-n','3','127.0.0.1' -PassThru -WindowStyle Hidden
          $env:LOCALAPPDATA = "$d\lad"
          $p = Start-Process "$d\lad\7HillsLink\update\7HillsLink-9.9.9.exe" -ArgumentList '--install-to',"$d\7HillsLink.exe",'--wait',"$($dummy.Id)",'--from-version','0.0.1' -PassThru
          $p | Wait-Process -Timeout 90
          $log = "$d\lad\7HillsLink\update\update.log"
          Get-Content $log
          Get-Process 7HillsLink -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Select-String -Path $log -Pattern ' updated$' -Quiet)) { Write-Error 'install did not complete'; exit 1 }
          # The log, not the file: the new version removes 7HillsLink.old.exe soon after it starts.
          if (-not (Select-String -Path $log -Pattern ' kept 7HillsLink\.old\.exe$' -Quiet)) { Write-Error 'no backup kept'; exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/7HillsLink.exe -Algorithm SHA256).Hash.ToLower()
          "$h  7HillsLink.exe" | Out-File -Encoding ascii -NoNewline dist/7HillsLink.exe.sha256
          Write-Host "sha256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: 7HillsLink
          path: dist/7HillsLink.exe
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/sevenhills_link/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
      # Every push to main publishes (or refreshes) the release for the version in __init__.py.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 7Hills Link ${{ steps.ver.outputs.tag }}
          body: |
            Windows SmartScreen asks once because the exe is not signed yet: More info → Run anyway.
            Download: https://github.com/TheBanjolorian/7hills-link/releases/latest/download/7HillsLink.exe
            Linux (Wine/Proton): https://github.com/TheBanjolorian/7hills-link/releases/latest/download/7HillsLink-x86_64.AppImage, see https://github.com/TheBanjolorian/7hills-link#linux-wine--proton
          files: |
            dist/7HillsLink.exe
            dist/7HillsLink.exe.sha256
          overwrite_files: true
          make_latest: true

  linux:
    needs: test
    # Built on the oldest supported Ubuntu: the AppImage runs on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1 gir1.2-gstreamer-1.0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # PyGObject 3.51+ needs GLib 2.80 (girepository-2.0); Ubuntu 22.04 has 2.72.
          pip install -r requirements.txt "PyGObject<3.51" pyinstaller
      - name: appimagetool
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
      - name: Build AppImage
        run: APPIMAGETOOL="$PWD/appimagetool" PYTHON=python ./packaging/linux/build-appimage.sh
      - name: Smoke test
        run: |
          v=$(APPIMAGE_EXTRACT_AND_RUN=1 ./dist/7HillsLink-x86_64.AppImage --version)
          echo "version: $v"
          test "$v" = "$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sevenhills_link/__init__.py)"
      - uses: actions/upload-artifact@v4
        with:
          name: 7HillsLink-linux
          path: |
            dist/7HillsLink-x86_64.AppImage
            dist/7HillsLink-x86_64.AppImage.sha256

  # Adds the AppImage to the release the windows job published, once both builds are done.
  linux-release:
    needs: [windows, linux]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 7HillsLink-linux
          path: dist
      - name: Version
        id: ver
        run: echo "tag=v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sevenhills_link/__init__.py)" >> "$GITHUB_OUTPUT"
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            dist/7HillsLink-x86_64.AppImage
            dist/7HillsLink-x86_64.AppImage.sha256
          overwrite_files: true
