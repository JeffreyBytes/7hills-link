name: Build 7Hills Link

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install grpcio protobuf pytest
      - run: python -m pytest -q tests
        env:
          PYTHONPATH: src

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name 7HillsLink
          --paths src
          --add-data "src/sevenhills_link/ui;sevenhills_link/ui"
          --collect-submodules sevenhills_link
          --hidden-import keyring.backends.Windows
          --hidden-import pystray._win32
          run_client.py
      - name: Smoke test
        shell: pwsh
        run: |
          $v = & .\dist\7HillsLink.exe --version | Out-String
          Write-Host "version: $v"
      - name: Update swap test
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'swaptest'
          New-Item -ItemType Directory -Force $d, "$d\lad" | Out-Null
          Copy-Item dist/7HillsLink.exe "$d\7HillsLink.exe"
          Copy-Item dist/7HillsLink.exe "$d\new.exe"
          $dummy = Start-Process ping -ArgumentList '-n','3','127.0.0.1' -PassThru -WindowStyle Hidden
          $env:LOCALAPPDATA = "$d\lad"
          $env:PYTHONPATH = 'src'
          python -c "import sys; from pathlib import Path; from sevenhills_link import updater; p=updater.update_dir()/'swap.ps1'; p.write_text(updater.swap_script(Path(sys.argv[1]), Path(sys.argv[2]), [int(sys.argv[3])]), encoding='utf-8-sig'); print(p)" "$d\7HillsLink.exe" "$d\new.exe" $dummy.Id
          $script = "$d\lad\7HillsLink\update\swap.ps1"
          $errs = $null; [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs; exit 1 }
          $p = Start-Process powershell -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',$script -PassThru -WindowStyle Hidden
          $p | Wait-Process -Timeout 90
          Get-Content "$d\lad\7HillsLink\update\update.log"
          Get-Process 7HillsLink -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not (Select-String -Path "$d\lad\7HillsLink\update\update.log" -Pattern ' updated$' -Quiet)) { Write-Error 'swap did not complete'; exit 1 }
          if (-not (Test-Path "$d\7HillsLink.old.exe")) { Write-Error 'no backup kept'; exit 1 }
      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/7HillsLink.exe -Algorithm SHA256).Hash.ToLower()
          "$h  7HillsLink.exe" | Out-File -Encoding ascii -NoNewline dist/7HillsLink.exe.sha256
          Write-Host "sha256: $h"
      - uses: actions/upload-artifact@v4
        with:
          name: 7HillsLink
          path: dist/7HillsLink.exe
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/sevenhills_link/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "tag=v$v" >> $env:GITHUB_OUTPUT
      # Every push to main publishes (or refreshes) the release for the version in __init__.py.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 7Hills Link ${{ steps.ver.outputs.tag }}
          body: |
            Windows SmartScreen asks once because the exe is not signed yet: More info → Run anyway.
            Download: https://github.com/TheBanjolorian/7hills-link/releases/latest/download/7HillsLink.exe
          files: |
            dist/7HillsLink.exe
            dist/7HillsLink.exe.sha256
          overwrite_files: true
          make_latest: true
